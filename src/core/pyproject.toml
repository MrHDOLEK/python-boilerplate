[project]
name = "core"
version = "0.0.0"
description = "Core functionality"
authors = [
  { name = "Aleksander Kowalski" }
]
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
  "utils",
  "typer>=0.27.2",
  "pydantic>=2.13.5",
  "pyyaml>=6.0.3",
  "wireup>=2.12.0",
  "requests>=2.34.2",
  "tabulate>=0.10.0",
  "python-dotenv>=1.2.3",
  "pyyaml-env-tag>=1.1"
]

[project.scripts]
core = "core.main:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
utils = { workspace = true }
