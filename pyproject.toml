[project]
name = "monorepo"
version = "0.0.0"
description = "Example of monorepo setup using UV"
authors = [
  { name = "Aleksander Kowalski" }
]
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
  "python-dotenv>=1.2.3",
  "pyyaml-env-tag>=1.1",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ty>=0.0.80",
  "ruff>=0.16.7",
  "pre-commit>=4.6.2",
  "types-PyYAML>=6.0.12.20260906",
  "types-requests>=2.33.0.20260906",
  "utils",
  "core",
]

[tool.uv.sources]
utils = { workspace = true }
core = { workspace = true }

[tool.uv.workspace]
members = [
  "shared/*", "src/*"
]

[tool.uv]
package = false

[tool.ruff]
lint.extend-select = ["S"]
lint.ignore = ["E501"]
lint.per-file-ignores = { "**/tests/**" = ["S101"] }
format.docstring-code-format = true
extend-exclude = [
  "__pycache__",
  ".eggs",
  ".git",
  ".venv",
  "build",
  "dist",
  "notebooks",
  ".cache"
]
line-length = 100

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
cache_dir = "./.cache/pytest"
pythonpath = [".", "scripts"]
